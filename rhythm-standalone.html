<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>リズムのひろば</title><style>:root{font-family:'Noto Sans JP',sans-serif;color:#263d38;background:#f5f5ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:28px 38px 16px}button,input{font:inherit}button{cursor:pointer;border:1px solid #d9dfd7;border-radius:10px;background:#fff;color:#3a514a;padding:10px 14px;font-weight:600}button:hover{background:#edf1e8}button:focus-visible,input:focus-visible{outline:3px solid #df9f46;outline-offset:3px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:2.5px;color:#7b8d75}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:27px;letter-spacing:1px;margin:6px 0}h1 span{font-size:12px;font-weight:500;letter-spacing:0;margin-left:14px;color:#839087}.header-actions{display:flex;gap:8px}.header-actions button{font-size:12px}#fullscreen{background:#294f43;color:white;border-color:#294f43}main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;max-width:1800px;margin:auto}.workspace{min-width:0}.board-heading{display:flex;justify-content:space-between;align-items:center;margin:0 0 18px;font-weight:700;font-size:15px}.meter{font-size:12px;color:#7a8a7d;font-weight:500}.meter i{padding:0 10px;color:#b5bdae}#board{display:flex;flex-direction:column;gap:25px}.bar-label{font-size:11px;color:#889184;margin-bottom:8px;letter-spacing:1px}.bar{position:relative;width:100%;aspect-ratio:4;display:grid;grid-template-columns:repeat(4,1fr);border:2px solid #b8c5ad;border-radius:14px;overflow:hidden;background:#fffef9}.beat{border-right:2px solid #dce3d3;position:relative}.beat:last-child{border:0}.beat-number{position:absolute;bottom:8px;left:12px;color:#a8b29f;font-size:11px;font-weight:600}.slot{position:absolute;top:0;bottom:0;border:0;border-radius:0;padding:0;background:transparent;width:12.5%}.slot:hover{background:#ecf0e3}.note{position:absolute;top:0;bottom:0;padding:12px 6px 22px;border:0;border-right:2px solid #fffdf5;border-radius:0;display:flex;align-items:center;justify-content:center;background:#e5edcf;color:#233b2f;cursor:grab}.note:hover{background:#d8e5b9}.note[data-kind="eighth"],.note[data-kind="eighthRest"]{background:#f7e5c6}.note[data-kind="dotted"],.note[data-kind="takka"]{background:#dce9e7}.note[data-kind="half"],.note[data-kind="whole"]{background:#e8e3f0}.note svg{height:85%;width:100%;max-width:210px;overflow:visible;pointer-events:none}.note .duration{position:absolute;bottom:7px;right:10px;font-size:10px;color:#6e7c5d}.tools,.saved{background:#fffefb;border:1px solid #e2e5d9;border-radius:14px;padding:18px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}h2{font-size:14px;margin:0}.section-title>span{font-size:10px;color:#889184}#palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.pick{padding:6px 2px 5px;border-radius:8px;display:flex;align-items:center;flex-direction:column;border:1px solid #e3e6dc;min-width:0}.pick svg{width:40px;height:44px}.pick span{font-size:8px;white-space:nowrap}.pick.active{border:2px solid #6d8653;background:#eef3e4;padding:5px 1px 4px}.hint{font-size:10px;line-height:1.9;color:#8a9486;margin:15px 0 10px}#message{font-size:11px;color:#577042;min-height:35px;padding-top:8px;border-top:1px solid #eceee4}.saved{margin-top:16px}.save-form{display:flex;gap:6px}input{min-width:0;width:100%;border:1px solid #dce0d4;border-radius:8px;padding:9px;font-size:11px;background:#fafbf5}.save-form button{white-space:nowrap;padding:8px 10px;font-size:11px;background:#edf2e4}#patterns{margin-top:12px;display:flex;flex-direction:column;gap:6px}.pattern{display:flex;align-items:center;border:1px solid #e8ebdf;border-radius:8px;overflow:hidden}.pattern.chosen{border-color:#8da577;background:#f0f4e9}.load{flex:1;text-align:left;border:0;background:transparent;padding:10px;font-size:11px;border-radius:0}.delete{border:0;background:transparent;color:#a0a998;padding:8px 10px;font-size:15px}.storage-note{font-size:9px;color:#9aa291;margin:12px 0 0}footer{font-size:11px;color:#8b9585;display:flex;align-items:center;gap:7px;margin-top:25px}.dot{height:6px;width:6px;background:#9db17f;border-radius:50%}body.present aside,body.present footer,body.present h1 span{display:none}body.present main{grid-template-columns:1fr;max-width:min(150vh,1800px)}body.present header{margin-bottom:12px}body.present #board{gap:12px}body.present .bar-label{margin-bottom:3px}@media(min-width:1500px){main{grid-template-columns:minmax(0,1fr) 340px}.pick span{font-size:9px}}@media(max-width:950px){body{padding:20px}main{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:16px}.saved{margin:0}header{gap:12px}h1 span{display:none}#palette{grid-template-columns:repeat(5,1fr)}}@media(max-width:550px){body{padding:14px}header{align-items:flex-start}h1{font-size:21px}.header-actions{flex-wrap:wrap;justify-content:flex-end}.header-actions button{padding:7px;font-size:10px}aside{grid-template-columns:1fr}.bar{border-radius:8px}.note{padding:6px 2px 16px}.note .duration{font-size:8px;bottom:4px;right:4px}.beat-number{bottom:4px;left:6px}}
.transport{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;background:#fffef9;border:1px solid #dce3d3;border-radius:12px;font-size:12px}.transport #play{background:#294f43;color:white;min-width:95px}.tempo-label,.loop-label{display:flex;align-items:center;gap:7px}.tempo-label input{width:65px;font-size:15px;padding:6px}.loop-label input{width:16px;height:16px;accent-color:#294f43}#play-status{margin-left:auto;font-weight:700;color:#61733b;font-size:14px;min-width:140px}.beat-cursor{position:absolute;top:0;bottom:0;width:25%;pointer-events:none;z-index:4;background:rgba(255,198,53,.24);box-shadow:inset 0 0 0 5px #e4a92d}.note.playing-note svg{filter:drop-shadow(0 0 5px #e6a832);color:#805400}.drop-preview{display:none;position:absolute;top:0;bottom:0;z-index:6;pointer-events:none;background:#b7dfb577;box-shadow:inset 0 0 0 4px #488356}.drop-preview.visible{display:block}.drop-preview.invalid{background:#f3aaaa88;box-shadow:inset 0 0 0 4px #bd5252}.pick[draggable=true]{cursor:grab}body.present main{max-width:min(136vh,1800px)}body.present .transport{padding:7px 12px;margin-bottom:10px}body.present .board-heading{margin-bottom:8px}@media(max-width:550px){.transport{gap:10px;padding:10px}#play-status{width:100%;margin:0}}
</style></head>
<body><header><div><span class="eyebrow">RHYTHM PLAYGROUND</span><h1>リズムのひろば <span>2小節であそぼう</span></h1></div><div class="header-actions"><button id="undo">↶ もどす</button><button id="clear">クリア</button><button id="fullscreen">⛶ 全画面</button></div></header>
<main><section class="workspace"><div class="board-heading"><span id="pattern-title">はじめのリズム</span><span class="meter">4 / 4 <i>•</i> 2小節</span></div><div class="transport" aria-label="メトロノーム"><button id="play" aria-pressed="false">▶ 再生</button><label class="tempo-label">テンポ <input id="tempo" type="number" min="40" max="240" value="100" inputmode="numeric"> BPM</label><label class="loop-label"><input id="loop" type="checkbox">くり返す</label><output id="play-status" role="status" aria-live="polite">4カウントでスタート</output></div><div id="board" aria-label="2小節のリズム"></div></section>
<aside><section class="tools"><div class="section-title"><h2>音符をえらぶ</h2><span>タップ、またはドラッグ</span></div><div id="palette"></div><p class="hint">音符の長さに合わせてマスが広がります。<br>音符をドラッグしてマスにドロップできます。</p><div id="message" role="status" aria-live="polite">好きな音符を並べてみよう！</div></section>
<section class="saved"><div class="section-title"><h2>リズムの引き出し</h2><span id="save-count"></span></div><div class="save-form"><input id="name" maxlength="30" placeholder="パターンの名前" aria-label="保存するパターンの名前"><button id="save">＋ 保存</button></div><div id="patterns"></div><p class="storage-note">このブラウザに保存されます</p></section></aside></main><footer><span class="dot"></span>再生するとメトロノームが鳴ります。手をたたいて、リズムを楽しもう。</footer><script>const TYPES=[['quarter','四分音符',2],['eighth','八分音符',1],['quarterRest','四分休符',2],['eighthRest','八分休符',1],['whole','全音符',8],['half','二分音符',4],['dotted','付点四分',3],['sixteenths','16分の4連',2],['eighths','8分の2連',2],['takka','タッカ',2]];
const head=(x,y,open=false)=>`<ellipse cx="${x}" cy="${y}" rx="10" ry="7" transform="rotate(-20 ${x} ${y})" fill="${open?'white':'currentColor'}" stroke="currentColor" stroke-width="3"/>`;
const stem=(x,y)=>`<path d="M${x+9} ${y}V${y-48}" stroke="currentColor" stroke-width="4"/>`;
function symbol(kind){let s='';if(kind==='whole')s=head(50,61,true);else if(kind==='quarterRest')s='<path d="M49 15L62 32L48 44L59 60Q35 55 48 80Q20 63 44 52L34 40L48 28L40 15Z" fill="currentColor"/>';else if(kind==='eighthRest')s='<circle cx="40" cy="38" r="8" fill="currentColor"/><path d="M41 44Q53 48 61 32L48 80" fill="none" stroke="currentColor" stroke-width="5"/>';else if(['sixteenths','eighths','takka'].includes(kind)){const xs=kind==='sixteenths'?[14,37,60,83]:[25,72];s=xs.map(x=>head(x,72)+stem(x,72)).join('');s+=`<path d="M${xs[0]+9} 24H${xs.at(-1)+9}" stroke="currentColor" stroke-width="7"/>`;if(kind==='sixteenths')s+=`<path d="M23 36H92" stroke="currentColor" stroke-width="6"/>`;if(kind==='takka')s+='<circle cx="47" cy="68" r="4" fill="currentColor"/><path d="M67 36H81" stroke="currentColor" stroke-width="6"/>';}else{s=head(43,73,kind==='half')+stem(43,73);if(kind==='eighth')s+='<path d="M52 25Q79 38 63 56Q69 41 52 38Z" fill="currentColor"/>';if(kind==='dotted')s+='<circle cx="67" cy="70" r="4" fill="currentColor"/>';}return `<svg viewBox="0 0 105 100" aria-hidden="true">${s}</svg>`;}
let notes=[{bar:0,start:0,kind:'quarter'},{bar:0,start:2,kind:'eighths'},{bar:0,start:4,kind:'quarter'},{bar:0,start:6,kind:'quarterRest'},{bar:1,start:0,kind:'dotted'},{bar:1,start:3,kind:'eighth'},{bar:1,start:4,kind:'takka'},{bar:1,start:6,kind:'quarter'}];let selected='quarter',history=[],active=null,drag=null;
const $=s=>document.querySelector(s),len=k=>TYPES.find(t=>t[0]===k)[2],copy=x=>JSON.parse(JSON.stringify(x));let patterns=[];try{patterns=JSON.parse(localStorage.getItem('rhythm-patterns-v1')||'[]');if(!Array.isArray(patterns))patterns=[];patterns=patterns.filter(p=>typeof p.name==='string'&&Array.isArray(p.notes)&&p.notes.every(n=>[0,1].includes(n.bar)&&Number.isInteger(n.start)&&n.start>=0&&TYPES.some(t=>t[0]===n.kind)&&n.start+len(n.kind)<=8));}catch{}
function say(t){$('#message').textContent=t;}function remember(){history.push(copy(notes));if(history.length>40)history.shift();}function changed(){active=null;$('#pattern-title').textContent='編集中のリズム';render();}function place(bar,start){if(selected==='erase'){const hit=notes.find(n=>n.bar===bar&&start>=n.start&&start<n.start+len(n.kind));if(hit){remember();notes=notes.filter(n=>n!==hit);changed();}return;}const size=len(selected);if(start+size>8){say('小節の中に収まる場所を選んでね。');return;}remember();notes=notes.filter(n=>n.bar!==bar||n.start>=start+size||n.start+len(n.kind)<=start);notes.push({bar,start,kind:selected});changed();say('配置しました。ほかの音符も並べてみよう！');}
function move(targetBar,targetStart){if(!drag)return;const source=notes.find(n=>n.bar===drag.bar&&n.start===drag.start);if(!source)return;const target=notes.find(n=>n.bar===targetBar&&targetStart>=n.start&&targetStart<n.start+len(n.kind));if(target===source)return;const moved={...source,bar:targetBar,start:target?target.start:targetStart};let next=notes.filter(n=>n!==source&&n!==target).concat(moved);if(target)next.push({...target,bar:source.bar,start:source.start});const valid=next.every((a,i)=>a.start+len(a.kind)<=8&&next.every((b,j)=>i===j||a.bar!==b.bar||a.start+len(a.kind)<=b.start||b.start+len(b.kind)<=a.start));if(!valid){say('長さが収まらないため入れ替えできません。空いている場所へ移動してね。');return;}remember();notes=next;changed();say(target?'音符を入れ替えました。':'音符を移動しました。');}
function render(){const board=$('#board');board.replaceChildren();for(let bar=0;bar<2;bar++){const wrap=document.createElement('div');wrap.innerHTML=`<div class="bar-label">${String(bar+1).padStart(2,'0')} 小節目</div><div class="bar">${[1,2,3,4].map(i=>`<div class="beat"><span class="beat-number">${i}</span></div>`).join('')}</div>`;const row=wrap.querySelector('.bar');for(let start=0;start<8;start++){const slot=document.createElement('button');slot.className='slot';slot.style.left=`${start*12.5}%`;slot.setAttribute('aria-label',`${bar+1}小節目 ${start/2+1}拍目に配置`);slot.onclick=()=>place(bar,start);row.append(slot);}for(const n of notes.filter(n=>n.bar===bar)){const tile=document.createElement('button');tile.className='note';tile.dataset.kind=n.kind;tile.dataset.start=n.start;tile.dataset.length=len(n.kind);tile.style.left=`${n.start*12.5}%`;tile.style.width=`${len(n.kind)*12.5}%`;tile.draggable=true;tile.setAttribute('aria-label',`${bar+1}小節目 ${n.start/2+1}拍目 ${TYPES.find(t=>t[0]===n.kind)[1]}`);tile.innerHTML=symbol(n.kind)+`<span class="duration">${len(n.kind)/2}拍</span>`;tile.onclick=e=>{const rect=tile.getBoundingClientRect();const offset=Math.min(len(n.kind)-1,Math.floor((e.clientX-rect.left)/(rect.width/len(n.kind))));place(bar,e.detail===0?n.start:n.start+Math.max(0,offset));};tile.ondragstart=e=>{drag={bar:n.bar,start:n.start};e.dataTransfer.setData('text/plain','rhythm');e.dataTransfer.effectAllowed='move';};tile.ondragend=clearDrop;row.append(tile);}const preview=document.createElement('div');preview.className='drop-preview';row.append(preview);
const dropStart=e=>{const r=row.getBoundingClientRect();return Math.max(0,Math.min(7,Math.floor((e.clientX-r.left)/r.width*8)));};
row.ondragover=e=>{if(!drag)return;e.preventDefault();const start=dropStart(e);const kind=drag.kind||notes.find(n=>n.bar===drag.bar&&n.start===drag.start)?.kind;if(!kind)return;e.dataTransfer.dropEffect=drag.kind?'copy':'move';preview.style.left=`${start*12.5}%`;preview.style.width=`${Math.min(len(kind),8-start)*12.5}%`;preview.classList.add('visible');preview.classList.toggle('invalid',start+len(kind)>8);};
row.ondragleave=e=>{if(!row.contains(e.relatedTarget))preview.classList.remove('visible');};
row.ondrop=e=>{if(!drag)return;e.preventDefault();const start=dropStart(e);if(drag.kind){const previous=selected;selected=drag.kind;place(bar,start);selected=previous;}else move(bar,start);clearDrop();};board.append(wrap);}$('#undo').disabled=!history.length;renderPatterns();}
for(const [kind,label]of [...TYPES,['erase','消しゴム']]){const b=document.createElement('button');b.className='pick'+(kind===selected?' active':'');b.innerHTML=kind==='erase'?'<span style="height:44px;font-size:25px;padding-top:4px">⌫</span><span>消しゴム</span>':symbol(kind)+`<span>${label}</span>`;b.title=label;if(kind!=='erase'){b.draggable=true;b.ondragstart=e=>{drag={kind};e.dataTransfer.setData('text/plain','rhythm');e.dataTransfer.effectAllowed='copy';};b.ondragend=clearDrop;}b.setAttribute('aria-pressed',kind===selected);b.onclick=()=>{selected=kind;document.querySelectorAll('.pick').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b);});say(kind==='erase'?'消したい音符をタップしてね。':`${label}を置く場所をタップしてね。`);};$('#palette').append(b);}
function persist(){try{localStorage.setItem('rhythm-patterns-v1',JSON.stringify(patterns));return true;}catch{say('保存できませんでした。ブラウザの保存容量・設定を確認してください。');return false;}}
function renderPatterns(){$('#patterns').replaceChildren();$('#save-count').textContent=`${patterns.length} パターン`;for(const p of patterns){const row=document.createElement('div');row.className='pattern'+(active===p.id?' chosen':'');const load=document.createElement('button');load.className='load';load.textContent='▦  '+p.name;load.onclick=()=>{remember();notes=copy(p.notes);active=p.id;$('#name').value=p.name;$('#pattern-title').textContent=p.name;render();say('保存したリズムを開きました。');};const del=document.createElement('button');del.className='delete';del.textContent='×';del.setAttribute('aria-label',p.name+'を削除');del.onclick=()=>{if(!confirm(`「${p.name}」を削除しますか？`))return;const previous=patterns;patterns=patterns.filter(x=>x.id!==p.id);if(!persist())patterns=previous;renderPatterns();};row.append(load,del);$('#patterns').append(row);}}
$('#save').onclick=()=>{const name=$('#name').value.trim()||`リズム ${patterns.length+1}`;const p={id:crypto.randomUUID(),name,notes:copy(notes)};patterns.push(p);if(!persist()){patterns.pop();return;}active=p.id;$('#pattern-title').textContent=name;$('#name').value='';renderPatterns();say('リズムを保存しました！');};$('#undo').onclick=()=>{if(history.length){notes=history.pop();changed();say('ひとつ前に戻しました。');}};$('#clear').onclick=()=>{remember();notes=[];changed();say('マスを空にしました。');};$('#fullscreen').onclick=async()=>{if(document.fullscreenElement){await document.exitFullscreen();return;}document.body.classList.toggle('present');if(document.body.classList.contains('present'))try{await document.documentElement.requestFullscreen();}catch{say('表示を大きくしました。ブラウザの全画面機能も使えます。');}};document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('present',!!document.fullscreenElement);$('#fullscreen').textContent=document.fullscreenElement?'⛶ 編集に戻る':'⛶ 全画面';});render();

function clearDrop(){drag=null;document.querySelectorAll('.drop-preview').forEach(e=>e.classList.remove('visible'));}
// Audio clock schedules only metronome clicks; the board follows the same clock.
let audio=null,playing=false,starting=false,runId=0,scheduler=null,frame=null,origin=0,nextClick=0,beatSeconds=.6,looping=false;
const voices=new Set();
function clickAt(time,accent){const oscillator=audio.createOscillator(),gain=audio.createGain();oscillator.type='sine';oscillator.frequency.value=accent?1300:900;gain.gain.setValueAtTime(0,time);gain.gain.linearRampToValueAtTime(.22,time+.003);gain.gain.exponentialRampToValueAtTime(.001,time+.055);oscillator.connect(gain);gain.connect(audio.destination);oscillator.start(time);oscillator.stop(time+.06);voices.add(oscillator);oscillator.onended=()=>{voices.delete(oscillator);oscillator.disconnect();gain.disconnect();};}
function clearHighlight(){document.querySelectorAll('.beat-cursor').forEach(e=>e.remove());document.querySelectorAll('.note.playing-note').forEach(e=>e.classList.remove('playing-note'));}
function stopPlayback(text='停止しました'){runId++;starting=false;playing=false;clearInterval(scheduler);cancelAnimationFrame(frame);for(const voice of voices){try{voice.stop();}catch{}}voices.clear();clearHighlight();$('#play').textContent='▶ 再生';$('#play').setAttribute('aria-pressed','false');$('#tempo').disabled=false;$('#loop').disabled=false;$('#play-status').textContent=text;}
function schedule(){while(playing&&origin+nextClick*beatSeconds<audio.currentTime+.12&&(looping||nextClick<12)){const time=origin+nextClick*beatSeconds;if(time>=audio.currentTime-.01)clickAt(Math.max(time,audio.currentTime),nextClick%4===0);nextClick++;}}
function animatePlayback(){if(!playing)return;const elapsed=(audio.currentTime-origin)/beatSeconds;if(!looping&&elapsed>=12){stopPlayback('2小節おわり！');return;}if(elapsed<4){clearHighlight();const count=Math.max(0,Math.floor(elapsed)+1);const text=count?`準備：${count} / 4`:'準備…';if($('#play-status').textContent!==text)$('#play-status').textContent=text;}else{const position=(elapsed-4)%8,bar=Math.floor(position/4),beat=Math.floor(position%4);clearHighlight();const row=document.querySelectorAll('.bar')[bar];const cursor=document.createElement('div');cursor.className='beat-cursor';cursor.style.left=`${beat*25}%`;row.append(cursor);const unit=(position%4)*2;row.querySelectorAll('.note').forEach(e=>e.classList.toggle('playing-note',unit>=Number(e.dataset.start)&&unit<Number(e.dataset.start)+Number(e.dataset.length)));const text=`${bar+1}小節目 · ${beat+1}拍目`;if($('#play-status').textContent!==text)$('#play-status').textContent=text;}frame=requestAnimationFrame(animatePlayback);}
$('#play').onclick=async()=>{if(playing||starting){stopPlayback();return;}const bpm=Number($('#tempo').value);if(!Number.isFinite(bpm)||bpm<40||bpm>240){$('#play-status').textContent='テンポは40〜240にしてください';$('#tempo').focus();return;}const id=++runId;starting=true;$('#play').textContent='■ 停止';$('#play').setAttribute('aria-pressed','true');try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('unsupported');if(!audio||audio.state==='closed')audio=new Audio();await audio.resume();if(id!==runId)return;if(audio.state!=='running')throw Error('suspended');starting=false;playing=true;beatSeconds=60/bpm;looping=$('#loop').checked;origin=audio.currentTime+.08;nextClick=0;$('#tempo').disabled=true;$('#loop').disabled=true;schedule();scheduler=setInterval(schedule,25);animatePlayback();}catch{if(id===runId)stopPlayback('音を開始できません。ブラウザの音声設定を確認してください。');}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(playing||starting))stopPlayback('画面を離れたため停止しました');});
window.addEventListener('pagehide',()=>stopPlayback());
</script></body></html>
